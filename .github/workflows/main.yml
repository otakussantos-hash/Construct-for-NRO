name: Compilar NRO

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      # A imagem já traz devkitA64 e libnx. Só tenta instalar se algo estiver faltando.
      - name: Conferir toolchain
        run: |
          if [ ! -f "$DEVKITPRO/libnx/switch_rules" ]; then
            for i in 1 2 3; do
              dkp-pacman -Sy --noconfirm --needed libnx switch-tools devkitA64 && break
              sleep 20
            done
          fi
          ls "$DEVKITPRO/libnx/switch_rules"

      - name: Compilar
        run: make

      - name: Publicar o .nro
        uses: actions/upload-artifact@v4
        with:
          name: Teste-nro
          path: Teste.nro
